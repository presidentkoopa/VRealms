// THE DOOR CLOSE (docs/VR_HANDWORKS.md): toggle_door_open_state ported (roth_runtime.cpp ToggleDoor), flat, STUDY1.
// Expect in log-handworks_close_flat.txt:
//  C2 door 6 opened by the hand (as handworks_flat A1), let go, swung by its own swing to 90; then the main hand's use on
//     its open leaf (roth_handworks_leafuse): "roth_trigger: line N is the leaf of OPEN door 6: toggle_door_open_state ->
//     toggled", "door 6 toggled: now CLOSING". The censuses after it: the original's step, 2.8125 degrees a tic at
//     M = 1 (doors.c:1043-1045, 1113-1125: 1 angle unit of 1.40625 degrees per 70 Hz tick): about 62 after 10 tics,
//     34 after 20, then shut (0, no swing) by 32.
//  C1 door 5 pushed open by the hand to about 20 degrees, brought back to shut, let go there: "brings door 5 back to
//     ... the original's use on the leaf -> it closes"; the census after: door 5 at 0, not swinging.
logfile handworks_close_flat
roth_movies 0
roth_lighting 1
roth_palette_shading 1
roth_img3d_dir D:/VRealms_img3d/items
// the owner's headset scale (164.3 units a metre). NOT archived.
roth_vr_units_per_metre 164.3
roth_vrpick_debug 1
roth_trigger_debug 1
roth_physics_debug 1

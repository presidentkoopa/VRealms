// VR PHYSICS M1 (docs/VR_PHYSICS.md), flat, STUDY1, the controllers driven by roth_xrpose, the owner's models.
// Expect in log-physics_flat.txt:
//  A. "the level is solid: N sectors", "the main hand is a body now"; the hand pushed 40 cm past the east wall:
//     "main hand STOPPED by something solid", roth_physics_status "STOPPED"; capture phys_A_wall.
//  B. the Helm (object 169/0, item 45) taken by touch, let go in front: "lets go of item 45: it is LOOSE", then
//     "loose item 45 comes to rest at (...)"; captures phys_B_*.
//  C. the palm at it, the grip: "takes loose item 45 where it touched it", "TAKES loose item 45"; phys_C_taken.
//  D. swung forward and let go: "(thrown)"; it rests further off.
//  E. taken again, the hand behind the head, let go: "over the shoulder", "STOWED over the shoulder".
logfile physics_flat
roth_movies 0
roth_lighting 1
roth_palette_shading 1
roth_img3d_dir D:/VRealms_img3d/items
roth_physics_debug 1
// the owner's headset scale (164.3 units a metre: his head at 1.00 m is the original's 144-unit eye). NOT archived.
roth_vr_units_per_metre 164.3
roth_vrpick_debug 1
roth_at 20 roth_xrpose on 0
roth_at 21 roth_xrpose hand main 0.20 -0.30 -0.35 0 0 0 0 0 1 1
roth_at 22 roth_xrpose hand off -0.20 -0.30 -0.35 0 0 0 0 0 0 0
// A. the wall at x 948 (interact_flat's too-far face); the player 82 units (0.5 m) from it facing east
roth_at 30 roth_xrpose standat 866 3760 384
roth_at 32 roth_xrpose hand main 0.20 -0.10 -0.30 0 0 0 0 0 1 1
roth_at 36 roth_physics_status
roth_at 38 roth_xrpose hand main 0.20 -0.10 -0.45 0 0 0 0 0 1 1
roth_at 39 roth_xrpose hand main 0.20 -0.10 -0.60 0 0 0 0 0 1 1
roth_at 40 roth_xrpose hand main 0.20 -0.10 -0.75 0 0 0 0 0 1 1
roth_at 41 roth_xrpose hand main 0.20 -0.10 -0.90 0 0 0 0 0 1 1
roth_at 44 roth_physics_status
roth_at 45 roth_xrpose log
roth_at 46 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/phys4_A_wall.png
roth_at 50 roth_xrpose hand main 0.20 -0.30 -0.35 0 0 0 0 0 1 1
// B. the Helm by touch, then let go in front of the chest
roth_at 60 roth_xrpose stand object 169 0 0.5
roth_at 62 roth_xrpose handat main object 169 0
roth_at 64 roth_xrpose handat main object 169 0 palm
roth_at 66 roth_xrpose grip main 1
roth_at 86 roth_physics_status
roth_at 88 roth_xrpose hand main 0.20 -0.15 -0.40 0 0 0 1 0 1 1
roth_at 92 roth_physics_status
roth_at 93 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/phys4_B_held.png
roth_at 95 roth_xrpose grip main 0
roth_at 97 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/phys4_B_falling.png

roth_at 141 roth_xrpose stand loose 0.6
roth_at 143 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/phys4_B_rest.png
// C. take it again where it lies
roth_at 148 roth_xrpose handat main loose palm 0 0 40
roth_at 149 roth_xrpose handat main loose palm 0 0 32
roth_at 150 roth_xrpose handat main loose palm 0 0 24
roth_at 151 roth_xrpose handat main loose palm 0 0 16
roth_at 152 roth_xrpose handat main loose palm 0 0 8
roth_at 153 roth_xrpose handat main loose palm

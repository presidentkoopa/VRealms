// THE COLT AS A REAL M1911 (roth_coltvr.h, roth_colt.h), flat, STUDY1, both controllers driven by roth_xrpose.
// Expect, in log-colt_flat.txt beside the exe:
//   the desk Colt as its own mesh; the Colt drawn as its mesh at the main hand; "roth_colttest hold": the wrist roll that
//   stands the gun upright.
//   R8 (2026-11-23): the shooting hand's button (roth_xrpose button main) on a full magazine: "release refused" and two
//   buzzes on the MAIN hand; the magazine stays.
//   R9, TWO HANDS: "roth_colttest offhand support" (the off hand turned and moved onto the fitted place): "TWO HANDS: the
//   off hand TAKES the grip" with the grip closed; L2 "SUPPORTING"; the eye / side / top captures zzzzj_colt_20..22;
//   a shot while supporting: recoil on both hands; the off hand to the pouch: "lets go of the grip -- a reload action".
//   12 more pulls: the word 12 -> 0, the slide locks back, the 13th a DRY CLICK.
//   R8: the button with the slide locked on the empty magazine: "MAGAZINE DROPPED"; again with no magazine: "the
//   button: nothing"; the pouch + grip: "MAGAZINE TAKEN" (capture zzzzj_colt_09_magheld: the magazine in the off hand);
//   the well: "MAGAZINE SEATED", "the original's reload pulled: i51 carried 2 -> 1, the Colt's word 0 -> 12"; the button:
//   "SLIDE FORWARD -- the slide stop"; a shot: 12 -> 11.
//   The loose parts: "[roth_colt] RealmsColt... LANDED at ... after N tics, D units from where it was thrown" for each
//   case and the magazine; the floor frames 06 / 06b (146 units) and 06c / 06d (nearer).
//   Away: 20 s without a shot: "[roth_colt] the original's weapon is Away ... the Colt stays drawn"; capture 10_away.

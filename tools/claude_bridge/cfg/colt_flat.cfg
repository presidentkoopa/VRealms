// THE COLT AS A REAL M1911 (roth_coltvr.h, roth_colt.h), flat, STUDY1, both controllers driven by roth_xrpose.
// Expect, in log-colt_flat.txt beside the exe:
//   the desk Colt as its own mesh (roth_img3d ... "the Colt's own mesh") and, with roth_xrpose on and the hands down,
//   no weapon picture for Adam's fists ([roth_colt] VR: no weapon picture for i68);
//   the Colt drawn as its mesh at the main hand; "roth_colttest hold": the wrist roll that stands the gun upright, its
//   bore level along the view; 12 shots ([roth_gunaim] VR shot ... climb ~0; [roth_colt] the spent case thrown ...),
//   the word 12 -> 0; "the last round fired: the slide locks back"; the pulls after it "DRY CLICK" (i51 still 2);
//   the off hand's index on the release + its trigger: "MAGAZINE DROPPED"; at the pouch + grip: "MAGAZINE TAKEN";
//   at the well: "MAGAZINE SEATED" and "the original's reload pulled: i51 carried 2 -> 1, the Colt's word 0 -> 12";
//   on the slide, grip, pulled 6 cm, let go: "SLIDE BACK", "SLIDE FORWARD -- racked: a round chambered"; after the
//   reload picture's lock a shot: the word 12 -> 11; roth_colt status lists the cases and the magazine LANDED.
// Captures: the desk Colt (beside ORACLE_PITCH=-60 oracle_shot.sh STUDY1 356 1816 128), the gun from the eye, close, from the side, the
// recoil, locked back, the magazine out, the loose parts on the floor; flat: the original's Colt picture.
logfile colt_flat
roth_movies 0
roth_lighting 1
roth_palette_shading 1
// the headset's metre (rothmap.cpp: the original's 144-unit eye on a 1.65 m head, stretch 1.1462 = 100 units a metre);
// flat has no head to measure, so the hands, the gun and its parts would be at Doom's 34. NOT archived.
roth_vr_units_per_metre 100

// THE COLT AS A REAL M1911 (roth_coltvr.h, roth_colt.h), flat, STUDY1, both controllers driven by roth_xrpose.
// Expect, in log-colt_flat.txt beside the exe:
//   the Colt drawn as its mesh at the main hand (FBX model colt1911.fbx:Default_1 loaded; part=Magaz, part=Gils);
//   12 shots ([roth_gunaim] VR shot ... from the drawn muzzle; [roth_colt] the spent case thrown ... each), the word
//   12 -> 0; "[roth_colt] the last round fired: the slide locks back"; the 13th pull "[roth_colt] the pull is a DRY
//   CLICK" (no reload: roth_weapon shows i51 still 2);
//   the off hand's index on the release + its trigger: "[roth_colt] MAGAZINE DROPPED" and "the empty magazine falls";
//   the off hand at the pouch + grip: "MAGAZINE TAKEN"; at the well: "MAGAZINE SEATED"; then "[roth_colt] the magazine
//   seated: the original's reload pulled ... i51 carried 2 -> 1, the Colt's word 0 -> 12 ... as the original";
//   the off hand on the slide, grip, pulled 6 cm, let go: "SLIDE BACK", "SLIDE FORWARD -- racked: a round chambered";
//   after the reload picture's lock, a shot: the word 12 -> 11.

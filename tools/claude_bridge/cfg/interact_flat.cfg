// VR INTERACTION P1 (docs/VR_INTERACTION.md: L1, L2, the pickup by squeeze, letting go stows), flat, STUDY1, both
// controllers driven by roth_xrpose (the headset's own path). Expect, in log-interact_flat.txt beside the exe:
//  A. TOUCH: "[roth_vrpick] main hand TOUCHES object (usable ...)" and its light tick; the squeeze: "USE object ...
//     acted", "PICKUP: the original gave item 45 ... flies to the main hand ... HOLDING", "[roth_ui] the pickup flies to
//     the main hand", "the pickup lands in it -- HOLDING", "L2 main hand: HOLDING, the item".
//  B. LET GO: "its hold of item 45 ends", "STOWED into the coat ... right hand slot now -1", the soft pulse.
//  C. POINT: the Colt magazine (object 41/1, item 51) pointed at from 1.5 m: "grip while pointing: USE object", PICKUP.
//  D. TOO FAR: wall face 1386 (0x18 record 167) pointed at from 270 units (the original's own too-far pose,
//     tools/userange_test/scripts/threshold.txt wall_270): "refused -- not usable: depth ~604 ... (too far)", two buzzes.
//  E. KEYED (object 109/2, +9 bit 1): the squeeze is the original's keyed branch -- no PICKUP line.
//  F. CARRIED: item 4 given and selected (the game put it in the hand); a squeeze on nothing: "closes on item 4 in it:
//     HOLDING"; let go: STOWED.
//  G. WEAPON: the desk Colt (object 305/0, item 9) by touch with the main hand free: "the original equipped weapon i9 ...
//     the main hand is free".
// Captures: zzzzi_interact_*.png (the rim on the touched item, the fly-in, the item in the hand, the stow).
logfile interact_flat
roth_movies 0
roth_lighting 1
roth_palette_shading 1
// the headset's metre (100 units a metre, as colt_flat): the 5 cm touch is 5 units. NOT archived.
roth_vr_units_per_metre 100
roth_vrpick_debug 1
roth_at 20 roth_xrpose on 0
roth_at 21 roth_xrpose hand main 0.20 -0.30 -0.35 0 0 0 0 0 1 1
roth_at 22 roth_xrpose hand off -0.20 -0.30 -0.35 0 0 0 0 0 0 0
// A. touch
roth_at 30 roth_xrpose stand object 169 0 0.5
roth_at 32 roth_xrpose handat main object 169 0
roth_at 34 roth_xrpose handat main object 169 0 palm
roth_at 36 roth_xrpose log
roth_at 38 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/zzzzi_interact_00_touch_rim.png

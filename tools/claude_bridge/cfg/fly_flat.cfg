// THE FLIGHTS (roth_img3d.h): the pickup's fly-in as the item's model, and the stow over the shoulder, flat, STUDY1,
// the controllers driven by roth_xrpose, the owner's models (D:/VRealms_img3d/items). The Helm (object 169/0, item 45,
// a model of its real 0.30 m) is touched and squeezed: expect "[roth_ui] the pickup flies to the main hand as item
// 45's model ... m as it lay -> 0.30 m in the hand", "[roth_img3d] flight 0: item 45's model flies", then "flight 0:
// landed (hidden)" and the held slot 0 model. Let go: "STOWED over the shoulder into the backpack", "flight 1: item
// 45's model flies", "flight 1: landed (hidden)". Captures flyNN_*.png every two tics through both flights.
logfile fly_flat
roth_movies 0
roth_lighting 1
roth_palette_shading 1
roth_img3d_dir D:/VRealms_img3d/items
roth_vr_units_per_metre 100
roth_vrpick_debug 1
roth_at 20 roth_xrpose on 0
roth_at 21 roth_xrpose hand main 0.20 -0.30 -0.35 0 0 0 0 0 1 1
roth_at 22 roth_xrpose hand off -0.20 -0.30 -0.35 0 0 0 0 0 0 0
roth_at 30 roth_xrpose stand object 169 0 0.8
roth_at 32 roth_xrpose handat main object 169 0
roth_at 34 roth_xrpose handat main object 169 0 palm
roth_at 36 roth_xrpose log
roth_at 38 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly00_before.png
roth_at 40 roth_xrpose grip main 1
roth_at 41 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly01_t1.png
roth_at 43 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly02_t3.png
roth_at 45 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly03_t5.png
roth_at 47 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly04_t7.png
roth_at 49 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly05_t9.png
roth_at 51 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly06_t11.png
roth_at 54 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly07_t14.png
roth_at 60 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly08_in_hand.png
roth_at 70 roth_xrpose grip main 0
roth_at 71 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly09_stow1.png
roth_at 73 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly10_stow3.png
roth_at 75 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly11_stow5.png
roth_at 77 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly12_stow7.png
roth_at 84 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/fly13_stowed.png
roth_at 90 roth_img3d status
roth_at 100 quit

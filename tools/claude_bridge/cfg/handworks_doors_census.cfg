// THINGS WORKED BY HAND (docs/VR_HANDWORKS.md): the door census of a map -- every swinging door, its hinge, and the use
// on each face beside it (opens / tests an item / refusal line). Run with -Map <name>; log-handworks_doors_census.txt.
logfile handworks_doors_census
roth_movies 0
roth_lighting 1
roth_palette_shading 1
roth_vr_units_per_metre 164.3
roth_at 20 roth_xrpose on 0
roth_at 21 roth_xrpose hand main 0.20 -0.30 -0.35 0 0 0 0 0 1 1
roth_at 22 roth_xrpose hand off -0.20 -0.30 -0.35 0 0 0 0 0 0 0
roth_at 30 roth_handworks_doors
roth_at 35 quit

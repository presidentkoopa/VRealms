// L1 AGAINST THE ORIGINAL (docs/VR_INTERACTION.md 6.1; roth_vrpick.cpp roth_l1diff; tools/userange_test l1diff).
// The original's eye rays (tools/userange_test/l1/STUDY1_oracle_pk.txt: 120 random poses x 15 cursor points, pitch 0;
// STUDY1_targets_oracle_pk.txt: an examine and a use at every use / examine face, door and item, stood 150 units off)
// through L1 in the engine, one "L1" line each, into build-dxr/RelWithDebInfo/l1diff_*.txt. Compare on the Linux side:
//   python3 tools/userange_test/userange.py l1diff <STUDY1.RAW> tools/userange_test/l1/STUDY1_oracle_pk.txt l1diff_study1.txt
logfile l1diff_flat
roth_movies 0
roth_lighting 1
roth_palette_shading 1
roth_at 40 roth_l1diff ../../tools/userange_test/l1/STUDY1_oracle_pk.txt l1diff_study1.txt
roth_at 41 roth_l1diff ../../tools/userange_test/l1/STUDY1_targets_oracle_pk.txt l1diff_study1_targets.txt
roth_at 44 quit

// THINGS WORKED BY HAND, milestone 2 (docs/VR_HANDWORKS.md), flat, STUDY1, the controllers driven by roth_xrpose /
// roth_worldtest (the real controller path). FREE doors by their handles: STUDY1's doors 5 and 6 take record #13 from
// both sides (0x2f, then "Open. Good."; roth_handworks_doors, handworks_doors_census.cfg). Expect in
// log-handworks_flat.txt:
//   A1 door 6 from the side it swings toward (a pull): "[roth_handworks] main hand takes door 6 by its handle, shut";
//      pulled: "draws door 6's handle ... the original's use -> acted; the door opens: the leaf is the hand's", the
//      original's "Open. Good."; pulled further: "swings door 6: ... degrees open"; let go: "lets go of door 6", "its
//      own swing takes it from there".
//   A2 door 5 from the side it swings away from (a push): the same lines for door 5, pushed.
//   Captures hw_A1_*, hw_A2_*. The keyed side of a door is handworks_key_flat.cfg.
logfile handworks_flat
roth_movies 0
roth_lighting 1
roth_palette_shading 1
roth_img3d_dir D:/VRealms_img3d/items
// the owner's headset scale (164.3 units a metre). NOT archived.
roth_vr_units_per_metre 164.3
roth_vrpick_debug 1
roth_trigger_debug 1
roth_physics_debug 1
roth_at 20 roth_xrpose on 0
roth_at 21 roth_xrpose hand main 0.20 -0.30 -0.35 0 0 0 0 0 1 1
roth_at 22 roth_xrpose hand off -0.20 -0.30 -0.35 0 0 0 0 0 0 0
roth_at 23 roth_sethealth 2000
// A1. door 6, pulled toward the player
roth_at 30 roth_worldtest spot door 6
roth_at 32 roth_worldtest stand 0.75
roth_at 34 roth_worldtest hold main palm n 0.03 0
roth_at 50 roth_worldtest report
roth_at 51 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/hw_A1_handle.png
roth_at 52 roth_worldtest grip main 1
roth_at 56 roth_worldtest move main n 0.10 10
roth_at 70 roth_worldtest report
roth_at 71 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/hw_A1_latch.png
roth_at 72 roth_worldtest move main n 0.20 14
roth_at 90 roth_worldtest report
roth_at 91 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/hw_A1_swing.png
roth_at 92 roth_worldtest grip main 0
roth_at 93 roth_worldtest hold main off
roth_at 130 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/hw_A1_open.png
roth_at 131 roth_handworks_doors
// A2. door 5, pushed away from the player
roth_at 140 roth_worldtest spot door 5 far
roth_at 142 roth_worldtest stand 0.6
roth_at 144 roth_worldtest hold main palm n 0.03 0
roth_at 160 roth_worldtest report
roth_at 161 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/hw_A2_handle.png
roth_at 162 roth_worldtest grip main 1
roth_at 166 roth_worldtest move main n -0.10 10
roth_at 180 roth_worldtest report
roth_at 182 roth_worldtest move main n -0.30 12
roth_at 196 roth_worldtest report
roth_at 197 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/hw_A2_swing.png
roth_at 198 roth_worldtest grip main 0
roth_at 199 roth_worldtest hold main off
roth_at 240 screenshot E:/DOOMWork/tools/claude_bridge_remaroth/logs/hw_A2_open.png
roth_at 241 roth_handworks_doors
roth_at 250 roth_xrpose off
roth_at 255 quit

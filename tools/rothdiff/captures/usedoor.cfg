// NO `logfile` LINE. It does not work: the cfgs that carry one (lantern.cfg,
// doorskin.cfg and the cone_*.cfg set) have never produced the file they name,
// and a `logfile` command here only CLOSED doomxr-log.txt and sent everything
// after it nowhere -- which lost the whole first run of this test. The engine
// already logs to doomxr-log.txt beside the exe; read that.

// Does the use key open a door? STUDY1, six doors.
//
// Written 2026-10-02 for the door-leaf use path. The claim under test: a door
// leaf is one-sided and ML_BLOCKING with no line special, so it ate the use ray
// (P_UseTraverse's `blocked` path, p_map.cpp:6608) and nothing behind it was
// reachable either. Leaves are now registered and marked after PO_Init, and a
// use on one calls SwingDoor -- GAME_core.md 4.5, toggle_door_open_state.
//
// WHAT TO READ IN THE OUTPUT
//
//  1. "rothdiff_use: ... N marked line(s) in level". Was 74 before this change,
//     counting trigger walls only. STUDY1 has 30 door leaves of 4 lines each,
//     so this should now read about 194. If it still says 74, the second
//     marking pass after PO_Init did not run or the leaves were not registered.
//
//  2. "use-ray: line N special 9000" for the leaf. Before, the leaf printed
//     special 0 and the ray stopped there.
//
//  3. "roth_trigger: line N is door leaf, poly tag T, event 0x1 -> SWUNG".
//     That line IS the fix working. "use accepted but swing refused" means the
//     path is wired but EV_OpenPolyDoor declined -- a tag mismatch or an
//     already-open door, not a dispatch failure.
//
// NO ARCHIVED CVARS ARE SET HERE, deliberately. Both debug cvars are declared
// with flags 0, so nothing in this file leaks into the owner's config the way
// the capture scripts' vr_mode and vid_* did (session handoff 3.5). This is a
// logic test, not a picture, so it needs no visual settings at all.
//
// THE ANGLES ARE NEGATED FROM doorgeom's OUTPUT. doorgeom -cam still computes
// the pre-fix convention, so every pose it prints needs (512 - a) % 512 until
// it is rebuilt (session handoff 3.2). Raw doorgeom angles were 0, 384, 128,
// 256, 0, 128 for these six.

roth_useray_debug 1
roth_trigger_debug 1

// x y angle512                      // doorgeom pose, sector
rothdiff_use -64 1380 0              // door01, sector 0,   raw ang 0
rothdiff_use -452 844 128            // door03, sector 23,  raw ang 384
rothdiff_use -692 2092 384           // door07, sector 47,  raw ang 128
rothdiff_use -64 2344 256            // door08, sector 48,  raw ang 256
rothdiff_use 576 1712 0              // door05, sector 30,  raw ang 0
rothdiff_use -1200 1600 384          // door10, sector 105, raw ang 128

// Which record flags actually occur, and does the 0x13 link test break firing?
//
// 2026-10-03. Two things are being read at once.
//
// 1. THE FLAG HISTOGRAM, in roth_<MAP>.log under "record flags present, by
//    opcode". Several rules have now been read out of ROTH.C whose bits may not
//    exist in this map at all, and building on an absent bit is worse than not
//    building on it. The line says, per opcode, which +0x06 / +0x07 pairs occur
//    and how many times, with the meaning spelled out:
//
//      0x13  the link variant (plain / water Z / linked platform), whether the
//            record wants the LEAVE refire (+0x06 & 0x40), and whether it is
//            facing-restricted (+0x06 & 0x0f -- the blocking half of the facing
//            mask has never been exercised, because nothing has had those bits).
//      0x19  whether it wants the platform TOP or the sector floor (+0x06 & 1).
//            Every one measured so far wants the floor, so the platform path is
//            implemented and untested.
//
// 2. THAT THE LINK TEST DID NOT BREAK WHAT WORKED. The variant gate is new, and
//    a water or linked record is now REFUSED unless the player is under the
//    surface or on the platform. If a variant were misread, 0x13 triggers that
//    fired yesterday would go silent -- the same inversion risk the facing mask
//    had. Sectors 1, 26, 42, 51 and 108 all fired before the gate existed and
//    must still fire, OR print "OUTSIDE the link" with a variant that explains
//    why.
//
// Sector 174 is deliberately NOT probed: its 0x13 chain warps the map to
// STUDY3, which ends the run.
//
// RUN IT WITH -config. See docs/REMAROTH_MEASURED.md 12.
//
//   doomxr.exe -config tools/rothdiff/captures/capture.ini -iwad vrealms.pk3
//              -rothpath E:\DOOMWork\_oracle +map STUDY1 +exec <this file>

roth_trigger_debug 1

rothdiff_sector 1 26 42 51 108

// LOAD AND LEAVE. The load report is written during the load, so all this has
// to do is make the process exit afterwards -- and `quit` cannot go in an exec
// script, which runs before `map` and would kill the process before a level
// exists. rothdiff_sprites quits after its last queued request, so it serves as
// the exit. Its output is not the point.
rothdiff_sprites 0 0 0 E:/DOOMWork/REMAROTH/tools/rothdiff/captures/probe.txt

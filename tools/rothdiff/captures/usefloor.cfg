// Does a floor-click trigger fire? STUDY1. Stage C of the 5.2 work.
//
// 0x19 is a left-click on a floor or platform top (GAME_core.md 5.2 row 6) and
// STUDY1 binds 12 of them -- six on sector 221 alone. They had no caller, and
// not for want of wiring: P_UseLines is entirely two-dimensional, so there is
// no flat in its path to hit and no pitch in it to aim with. roth::UseFlat
// traces from the eye along the view direction instead, and runs as a FALLBACK
// after the line path finds nothing.
//
// Also re-checks the FACING MASK, which is built but was never proven by a run.
// A set bit in a record's +0x06 bits 0-3 forbids that quadrant of player
// facing, and if the sense were inverted it would silently block all 23 of the
// 0x13 triggers instead of only the ones it should. So two 0x13 sectors known
// to have fired before the mask existed are visited again at the end: they must
// still fire. If they go quiet, the mask is backwards.
//
// RUN IT WITH -config. NOT OPTIONAL -- see sectorenter.cfg for why, and note
// capture.ini is deliberately a COPY of the owner's doomxr.ini, not a minimal
// file. Recreate it with:
//
//   cp "$USERPROFILE/Documents/My Games/DoomXR/doomxr.ini" capture.ini
//   sed -i 's/^vr_mode=.*/vr_mode=0/' capture.ini
//
//   doomxr.exe -config tools/rothdiff/captures/capture.ini -iwad vrealms.pk3
//              -rothpath E:\DOOMWork\_oracle +map STUDY1 +exec <this file>
//
// WHAT TO READ, in doomxr-log.txt
//
//  1. "rothdiff_sector: asked for N, standing in N, looking down". If the two
//     numbers differ the sector's centre is outside it and that probe proves
//     nothing -- skip it rather than calling it a failure.
//
//  2. "roth_trigger: floor sector N 0x19 use -> firing". That is stage C.
//
//  3. "roth_trigger: use ray hit no flat (type T)" means the trace reached a
//     wall or nothing before the floor. At 44 degrees down from eye height the
//     floor is well inside the 64-unit range, so this points at the probe, not
//     at the aim: TRACE_HitWall is type 1, TRACE_HitNone is 0.
//
//  4. "NO chain bound" means the trace landed in a different sector than the
//     one asked for -- a mid-platform top reports its own sector, which is the
//     interesting case for the record's flag bit0 ("platform-top instead of
//     the sector floor", 4.5) and is NOT implemented here.
//
//  5. From the tail: "sector 26 0x13 ... -> firing" and the same for 42. If
//     either prints "BLOCKED by facing mask", read the mask value -- being
//     blocked is only correct if that quadrant's bit is actually set.
//
// Note the map can change under this run: STUDY1 sector 174 carries an 0x13
// whose chain warps to STUDY3. None of the sectors below is 174, and the rig
// now abandons its queue on a map change rather than probing on into the wrong
// map, which is how the previous run ended.

roth_trigger_debug 1
roth_useray_debug 1

// Every sector carrying an 0x19 in STUDY1, from the load report's
// `0x19 sectors (12)` line. 221 holds six records and is given once.
rothdiff_usefloor 221 320 322 409 413 414 415

// The facing-mask control: two sectors whose 0x13 fired before the mask existed.
rothdiff_sector 26 42

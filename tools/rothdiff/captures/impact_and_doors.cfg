// The impact channel, AND that gating on the activated side did not break the
// use path. STUDY1, 2026-10-03.
//
// ActivateLine used to fire the chains on BOTH sidedefs of a line and discard
// the `side` the engine passes -- the loop ended in `(void)side`. A Realms
// two-sided wall is two faces, sisters, each paired to one sidedef, so one
// hitscan at side 91 fired both side 91 (face 85) and side 92 (face 1366), and
// where both sisters come from one record the chain ran twice for one shot. It
// now fires only the named side. The original has no ambiguity:
// dispatch_entry_command_trigger resolves ONE texmap from the pick
// (word[p1+8], raw_commands.c:3019).
//
// THAT CHANGE CAN REGRESS THE DOOR PATH, which is why both are in one run. If
// the loader paired a face to the opposite sidedef from the one Doom calls
// front, gating on `side` would stop finding the chain that used to fire. The
// doors are the control: they worked before this change and must still work.
//
// RUN IT WITH -config. See docs/REMAROTH_MEASURED.md 12.
//
//   doomxr.exe -config tools/rothdiff/captures/capture.ini -iwad vrealms.pk3
//              -rothpath E:\DOOMWork\_oracle +map STUDY1 +exec <this file>
//
// WHAT TO READ, in doomxr-log.txt
//
//  1. THE DOORS FIRST, so a regression shows before anything else. Six poses,
//     each must still print "is door leaf, poly tag T ... SWUNG". Any pose that
//     now prints "NO chain bound" or no roth_trigger line at all is the
//     side-gating change breaking what worked -- that is the thing this run is
//     really guarding.
//
//  2. "roth_trigger: line side S (face F) 0x1a impact -> firing", ONE per shot
//     now, not two. A pair of lines for a single shot means the side gate is
//     not taking effect.
//
//  3. Shots that print no roth_trigger line at all. Side 72 did this before:
//     the stand-off put the player against geometry and the log showed
//     "event 0x8" (SPAC_Push) on neighbouring lines instead -- the placement
//     was being shoved, not the trigger failing. Push correctly fires nothing,
//     since no Realms opcode wants it.
//
// The door poses are usedoor.cfg's, with the stale-convention angles already
// negated (doorgeom -cam still prints the pre-fix convention).

roth_trigger_debug 1

rothdiff_use -64 1380 0              // door01, sector 0
rothdiff_use -452 844 128            // door03, sector 23
rothdiff_use -692 2092 384           // door07, sector 47
rothdiff_use -64 2344 256            // door08, sector 48
rothdiff_use 576 1712 0              // door05, sector 30
rothdiff_use -1200 1600 384          // door10, sector 105

rothdiff_shoot op 1a

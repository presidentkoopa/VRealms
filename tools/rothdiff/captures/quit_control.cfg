// THE CONTROL FOR THE SHUTDOWN CRASH, 2026-10-02.
//
// usedoor.cfg opens six doors by the use key and then exits 0xC0000409 -- but it
// exits that way AFTER printing "all captures done; quitting", with every use
// already done and no fatal error in the log. So the crash is in shutdown, and
// the question is whether the door swing causes it.
//
// This run is usedoor.cfg with the doors taken out and nothing else changed. The
// pose is the player start (864, 3840), which pair2.cfg uses as its control:
// the nearest door leaf in STUDY1 is about 385 units away, far outside the
// 64-unit USERANGE, so the use ray cannot reach one and SwingDoor is never
// entered. Everything else is identical -- same rig, same queue, same
// P_UseLines, same "all captures done; quitting" exit.
//
// HOW TO READ IT
//
//   exits 0xC0000409 as well  -> the crash is NOT the door path. It is in
//                               shutdown generally and predates this work.
//                               Expect "0 within 64" on the use line, which
//                               also confirms no leaf was touched.
//   exits 0                   -> the crash IS caused by swinging a door, most
//                               likely a DPolyDoor thinker still mid-rotation
//                               when the level is torn down (usedoor.cfg quits
//                               about one tic after the last use, and a 90
//                               degree swing takes 32).
//
// A shot is queued first so the run also exercises the capture path the earlier
// lanes used many times without reporting a crash. Its PNG goes to the scratch
// directory; it is a by-product, not the point.

roth_useray_debug 1
roth_trigger_debug 1

rothdiff_shot 864 3840 0 C:/Users/Command/AppData/Local/Temp/claude/quit_control.png
rothdiff_use 864 3840 0

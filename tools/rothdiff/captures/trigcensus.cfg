// What the trigger table looks like once every opcode has an event, 2026-10-02.
//
// Stage A of the GAME_core.md 5.2 classification work. The load report now
// breaks triggers down per opcode with the event that fires each and whether
// anything can currently deliver it, replacing the single line "31 face-keyed,
// 12 sector-keyed" -- which could not show that every 0x13 in the map was bound
// to nothing.
//
// WHAT TO READ, in roth_STUDY1.log under "Level logic":
//
//   triggers by opcode, with the event that fires them:
//     0x13  ...  sector enter/leave  no dispatch: needs a sector-transition event
//     0x18  ...  use                 LIVE -- the use key
//     0x19  ...  use                 no dispatch: needs a use ray that lands on a flat
//     0x1a  ...  impact              LIVE -- a shot hitting the wall
//     0x31  ...  examine             no dispatch: there is no examine input yet
//     0x32  ...  examine             no dispatch: there is no examine input yet
//
// The 0x13 count is the number this project has never had: those triggers
// matched neither classifier, so they fell through the binding loop without
// appearing anywhere. Whatever it says is new information.
//
// Also check "triggers bound" still totals sensibly against the old 31 + 12.
// Sector-keyed should GROW by the 0x13 count, because 0x13 is now bound where
// it was skipped. Face-keyed should be unchanged at 31.
//
// A single use is queued at the first door pose so the run ends by itself and
// so the per-event gate is exercised: door01 is a leaf, so the line that fires
// is the door path, and no 0x1a should fire on a use anywhere in the log.

roth_useray_debug 1
roth_trigger_debug 1

rothdiff_use -64 1380 0              // door01, sector 0

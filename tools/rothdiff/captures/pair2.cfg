logfile E:/DOOMWork/REMAROTH/tools/rothdiff/captures/pair2.log
vr_mode 0

// The capture's own Printf lands in the notify area and is drawn OVER the
// frame, so every shot carried two lines of console text across the picture.
con_notifytime 0
con_midtime 0
showmessages 0
con_scaletext 0

// ROTH's own frame size. The pair was previously 3840x2137 against the
// original's 640x480, which is only good for "is it the same place".
// rothdiff_shot ends in M_ScreenShot, which grabs the window, so this should
// need no engine change. Captures are deferred to P_Ticker, so this applies
// to every shot below.
vid_setsize 640 480

// Neutral post-processing. The fork's defaults change every pixel.
vid_gamma 1
// ARCHIVED AND GLOBAL, and left out of the measured doc list until
// 2026-10-02: a human turning the gamma down in the headset writes
// vid_fixgamma into the config and darkens every capture afterwards.
vid_fixgamma 0
vid_blackpoint 0
vid_whitepoint 0
vid_contrast 1
vid_brightness 0
vid_saturation 1
gl_bloom 0
gl_ssao 0
gl_fxaa 0
gl_tonemap 0
gl_lens 0
gl_texture_filter 0
r_mipmap 0

r_drawplayersprites 0
hud_althud 0
screenblocks 12
crosshair 0

// Pose A is the CONTROL: angle 0, where the old and new angle conventions
// coincide, so it must look the same as REMA_poseA.png did. Pose C is the
// TEST: at angle 128 the old conversion looked the opposite way. Written to
// REMA2_* so the old frames survive as the "before" side of the comparison.
rothdiff_shot 864 3840 0   E:/DOOMWork/REMAROTH/tools/rothdiff/captures/REMA2_poseA.png
rothdiff_shot 864 3840 128 E:/DOOMWork/REMAROTH/tools/rothdiff/captures/REMA2_poseC.png

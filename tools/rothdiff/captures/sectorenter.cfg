// Does an enter-sector trigger fire? STUDY1. Stage B of the 5.2 work.
//
// 0x13 is the enter/leave-sector trigger (GAME_core.md 5.2 row 4) and STUDY1
// binds 23 of them -- 35% of every bound trigger in the map, and not one could
// fire before this: the opcode matched neither classifier, so it fell through
// the binding loop without appearing in any counter. NotifyPlayerSector, called
// once a tic from P_PlayerThink, is the dispatch.
//
// RUN IT WITH -config. NOT OPTIONAL:
//
//   doomxr.exe -config tools/rothdiff/captures/capture.ini -iwad vrealms.pk3
//              -rothpath E:\DOOMWork\_oracle +map STUDY1 +exec <this file>
//
// capture.ini is a COPY OF THE OWNER'S doomxr.ini with vr_mode forced to 0, and
// it is a copy on purpose. Two attempts at writing a minimal one from scratch
// failed in ways that cost the owner a disrupted session each: the first
// inherited vr_mode 15 from their config and took over the headset while they
// were wearing it, the second defaulted to fullscreen at 3840x2160 on the
// OpenGL backend and never loaded the map. The display settings in that file
// are known to work; do not re-derive them. What -config buys is that a run can
// no longer WRITE to the owner's config either, which is the whole 3.5 leak
// (vr_mode, roth_lighting, roth_pattern, vid_fixgamma) closed at the source.
//
// WHAT TO READ
//
//  1. roth_<MAP>.log, "Level logic": the per-opcode trigger table and the
//     `0x13 sectors (23): ...` line. The sectors below come from that line.
//     DO NOT put a console command that inspects the level in a cfg -- +exec
//     runs before the deferred `map`, so it finds no level. That is why the
//     listing is in the load report.
//
//  2. "rothdiff_sector: asked for N, standing in N". If the two numbers differ,
//     the sector is concave enough that its centre is outside it and that probe
//     proves nothing -- skip it rather than reading it as a failure.
//
//  3. "roth_trigger: player 0 entered sector N", then
//     "roth_trigger: sector N 0x13 sector enter/leave -> firing".
//     The second line is stage B working.
//
// A previous run visited sectors 96, 22, 375, 229, 31 and 202 -- the door poses
// -- and showed (3)'s first line but never its second, because none of those
// six carries an 0x13. The hook was right and the aim was wrong, which is what
// rothdiff_sector exists to fix.
//
// The first sighting after a load fires nothing by design: the player spawns
// already standing in a sector and whether the original fires that at spawn has
// not been measured. So the first sector below is a real transition from the
// player start, not from nowhere.

roth_trigger_debug 1

// Every sector carrying an 0x13 in STUDY1, from the load report. 430 is listed
// twice there -- two records on one sector -- and is given once here.
rothdiff_sector 1 26 42 51 108 174 193 209 266 293 324 330 332 358 374 379 393 409 430 432 448 454

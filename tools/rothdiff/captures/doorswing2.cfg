// Is a door leaf invisible everywhere, or only where it sits when closed?
//
// 2026-10-03. The leaf is present, collidable, correctly skinned and lit 160,
// placed in a real (non-POLYORG) subsector, and renders as a PURE black hole --
// the clear colour, not a dark surface.
//
// Polyobject segs go through the TWO-SIDED wall path: hw_bsp.cpp:707 forces
// `backsector = currentsector` and that value reaches
// HWWall::Process(seg, currentsector, backsector). With front == back there is
// no upper and no lower, so only DoMidTexture can draw the slab. That is also
// true of Hexen polyobject doors, which render fine, so the mechanism works in
// general and something about ours differs.
//
// This separates two possibilities in one run:
//
//   closed invisible, OPEN VISIBLE
//       the slab draws once it moves. Then it is about where it sits when
//       closed -- coplanar with the doorway's own wall pieces, z-fighting or
//       being clipped by them. Note the load report already flags
//       `doors: leaf faces coplanar with a drawn wall piece (UNVERIFIED risk) 1`.
//
//   invisible in BOTH
//       the slab never draws at all, and the question is DoMidTexture's rules
//       for this sidedef -- its scales, its pegging, or the opening it is
//       clipped to -- not its position.
//
// roth_door takes the polyobject tag; door01 is tag 1. The third shot is taken
// well after the swing so the slab has finished moving (a 90 degree swing is 32
// tics at the default speed).
//
// RUN IT WITH -config, and with NO lighting overrides: roth_lighting 0 and
// roth_shade_debug cancel each other (the debug mode is packed into uGlobVis
// only inside `if (Level->RothLighting)`, hw_drawinfo.cpp:1831).
//
//   doomxr.exe -config tools/rothdiff/captures/capture.ini -iwad vrealms.pk3
//              -rothpath E:\DOOMWork\_oracle +map STUDY1 +exec <this file>

roth_trigger_debug 1

// Closed, from 200 units: the wall beside it draws, the doorway is black.
rothdiff_shot -64 1228 0 E:/DOOMWork/REMAROTH/tools/rothdiff/captures/swing_closed.png

// Swing it, then look again from the same spot.
roth_door 1
rothdiff_shot -64 1228 0 E:/DOOMWork/REMAROTH/tools/rothdiff/captures/swing_open.png

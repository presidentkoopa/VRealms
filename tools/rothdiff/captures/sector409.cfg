// Why does sector 409's 0x19 not fire when its 0x13 does?
//
// 2026-10-03. STUDY1 sector 409 appears in BOTH of the load report's lists --
// `0x13 sectors` and `0x19 sectors` -- and on the usefloor.cfg run its 0x13
// fired while its 0x19 did not. The log showed neither "hit no flat" nor "NO
// chain bound", which means UseFlat returned through one of the exits that
// printed nothing. It now prints the whole trace result, so one run says which.
//
// RUN IT WITH -config. See docs/REMAROTH_MEASURED.md 12.
//
//   doomxr.exe -config tools/rothdiff/captures/capture.ini -iwad vrealms.pk3
//              -rothpath E:\DOOMWork\_oracle +map STUDY1 +exec <this file>
//
// WHAT TO READ, from "roth_trigger: flat probe -- hit type T, sector S, z Z,
// from z E pitch P":
//
//   no `flat probe` line at all
//       UseFlat was never called, so P_UseLines returned used == true before
//       reaching it -- most likely a prop actor in 409 with a Used override or
//       MF5_USESPECIAL eating the use in P_UseTraverse. The use-ray lines
//       printed just above will show what the ray met.
//
//   "Trace() found nothing within 64 units"
//       The ray ended in mid-air. Compare E (eye z) against the sector floor:
//       at 44 degrees down the vertical reach is about 44 units, so an eye more
//       than that above the floor cannot reach it inside the use range. That
//       would make this a RANGE problem and not a 409 problem, and the other
//       six sectors only worked because their floors were closer.
//
//   hit type 1 (TRACE_HitWall)
//       Something vertical is in the way within 64 units -- 409 is small, or
//       the centre spot is against a wall.
//
//   "sector S" where S != 409
//       The aim landed on a mid-platform top or a 3D floor, which reports its
//       own control sector. That is the PLATFORM-TOP case: GAME_core.md 4.5
//       says record flag bit0 selects the platform top instead of the sector
//       floor, and the port does not implement it. If so, 409's 0x19 is a
//       platform record and this is the first evidence of that path mattering.
//
// The last of those is the standing hypothesis, because 409 being in both lists
// suggests it is a platform sector rather than a plain room. It is a hypothesis
// and not a finding until this run prints.
//
// 413 is probed as the CONTROL: it is an 0x19 sector that DID fire, so its line
// shows what a working probe's numbers look like for comparison.

roth_trigger_debug 1
roth_useray_debug 1

rothdiff_usefloor 409 221 320 322 413 414 415

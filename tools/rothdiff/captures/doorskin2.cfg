// What a door leaf actually looks like. STUDY1, 2026-10-03.
//
// The owner reports "no textures on doors" from the headset. The loader
// disagrees: roth_STUDY1.log says `doors: leaf side had no artwork 0`, and
// rothmap.cpp:1917 sets side_t::mid with a valid FTextureID and a scale on
// every leaf side. A one-sided Doom line draws its mid texture, so an assigned
// texture that does not appear is being suppressed somewhere else.
//
// Candidates, none of them yet evidence:
//   - the Realms mid texture resolves to a colour-key / empty image, so it IS
//     drawn and is simply blank (the load report counts 1522 wall pieces left
//     undrawn on the colour key, "as the original does");
//   - the leaf's void-room sector is dark, so the slab renders black and reads
//     as untextured (RegisterLightFollower exists for exactly that sector);
//   - the scale: sx = stored / (len * unitsPerTexel), which with a bad stored
//     extent could stretch one texel across the whole slab.
//
// A picture separates those: black is lighting, flat colour is the colour key,
// a smeared band is the scale. It cannot settle alignment or scale beyond that
// -- do not try to read those off it.
//
// Poses are door01 and door03 from `doorgeom -cam STUDY1 48`, with the angles
// negated because doorgeom still prints the pre-fix convention.
//
// RUN IT WITH -config. See docs/REMAROTH_MEASURED.md 12.
//
//   doomxr.exe -config tools/rothdiff/captures/capture.ini -iwad vrealms.pk3
//              -rothpath E:\DOOMWork\_oracle +map STUDY1 +exec <this file>


// Realms shading makes a lit-view screenshot useless for "is there a texture":
// the first attempt came back near-black. roth_lighting 0 gives a flat-lit view.
// It is archived, but capture.ini is isolated so writing it reaches nobody.
// roth_shade_debug 1 is UNSHADED -- it bypasses the Realms shader outright.
// roth_lighting 0 was not enough: the candle cone still showed and the frame
// came back near-black twice. The instrument already existed (roth_runtime.cpp
// declares modes 1 unshaded, 2 light byte, 3 Z, 4 cone, 5 lantern, 6-7 row).
// NO LIGHTING OVERRIDES. roth_lighting 0 and roth_shade_debug FIGHT: the debug
// mode is packed into uGlobVis only inside `if (Level->RothLighting)`
// (hw_drawinfo.cpp:1831), so turning Realms lighting off disables the very
// path the debug mode lives in. Earlier frames were plain Doom lighting.
// This captures the game as the owner actually sees it.

rothdiff_shot -64 1228 0   E:/DOOMWork/REMAROTH/tools/rothdiff/captures/doorskin_01.png
rothdiff_shot -300 844 128 E:/DOOMWork/REMAROTH/tools/rothdiff/captures/doorskin_03.png

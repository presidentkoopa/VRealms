// Does an 0x1a fire when a shot hits its wall? STUDY1.
//
// 2026-10-03. 0x1a is the attack-hits-a-wall trigger: GAME_core.md 5.2 row 7
// gives its firer as collide_ray_walls_recursive -> fire_wall_object_trigger,
// and says of it "the player's POINT sweep never fires it" -- it is the weapon
// channel, not a bump. The runtime comment used to call it a BUMP and put it in
// the use bucket; it has been on SPAC_Impact since the per-event split and has
// never been seen to fire, because nothing in this rig could fire a weapon.
//
// STUDY1 has 4 records, all with +0x06 0x00 -- no direction restriction -- so
// every one should fire from any approach.
//
// `rothdiff_shoot op 1a` resolves the sides itself once the level is up. Do not
// paste sidedef numbers in here: +exec runs before the deferred `map`, so a cfg
// cannot read the load report, and hand-copied numbers go stale the moment the
// loader's face ordering changes.
//
// RUN IT WITH -config. See docs/REMAROTH_MEASURED.md 12.
//
//   doomxr.exe -config tools/rothdiff/captures/capture.ini -iwad vrealms.pk3
//              -rothpath E:\DOOMWork\_oracle +map STUDY1 +exec <this file>
//
// WHAT TO READ, in doomxr-log.txt
//
//  1. "rothdiff_shoot: opcode 0x1a is on N side(s)". Compare N against the load
//     report's `0x1a sides` line. One record can bind to several faces, so N
//     counts SIDES and will be >= the 4 records.
//
//  2. "rothdiff_shoot: side S (line L), standing at (x,y) facing F" per shot.
//     The stand-off is on whichever side of the line owns that sidedef -- a
//     Doom front side is to the RIGHT of v1->v2 -- so a shot from the wrong
//     side would hit the far face and read as the trigger not firing.
//
//  3. "roth_trigger: line side S (face F) 0x1a impact -> firing". That line is
//     the impact channel working, and the last of the three reachable channels
//     to be confirmed.
//
//  4. If a shot produces NO roth_trigger line at all, the hitscan did not reach
//     the wall: 40 units out with a 80-unit range should always land, so suspect
//     the stand-off being inside solid geometry, or the line being a door leaf
//     rather than a wall.
//
// SPAC_Impact is raised from inside the trace machinery, gated on the opt-in
// TRACE_Impact flag (p_trace.cpp:472), and P_LineAttack passes it. Checked while
// writing this: roth::UseFlat traces with TRACE_NoSky only, so the floor-click
// probe cannot raise an impact trigger as a side effect of a use.

roth_trigger_debug 1

rothdiff_shoot op 1a
